    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: NODE_ROLE
        value: central
      - key: NODE_ID
        value: central-hq
      - key: NODE_ADMIN_KEY
        value: rescue-admin-key-2026
      - key: GUIDE_TRUST_KEY
        value: rescue-guide-trust-key-2026
      - key: MESH_SHARED_KEY
        value: rescue-mesh-shared-key-2026
      - key: RESPONDER_SHARED_KEY
        value: rescue-responder-shared-key-2026
      - key: QDRANT_URL
        value: https://7b3cb247-fa8e-4344-841e-190094e210f6.eu-west-2-0.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
