services:
  - type: web
    name: rescuememory-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: NODE_ROLE
        value: central
      - key: NODE_ID
        value: central-hq
      - key: NODE_ADMIN_KEY
        value: rescue-admin-key-2026
      - key: GUIDE_TRUST_KEY
        value: rescue-guide-trust-key-2026
      - key: MESH_SHARED_KEY
        value: rescue-mesh-shared-key-2026
      - key: RESPONDER_SHARED_KEY
        value: rescue-responder-shared-key-2026
      - key: QDRANT_URL
        value: https://59916dae-f8fa-454e-9b92-96755f1251d4.us-east-1-1.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6NGNmOGY1MDUtZjhhMi00ZTEzLWFhOGMtZjBlMjk0MjRmNzViIn0.Bw1GfzE8jD61Yx179dU4Oj7bMKaMzLNXZP5Z9Wj-o2E
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
