<svg aria-labelledby="arch-title arch-description" class="architecture-diagram in-view" height="470" role="img" viewBox="0 0 1320 470" width="1320" xmlns="http://www.w3.org/2000/svg">
<title id="arch-title">RescueMemory architecture: local guidance, nearby transfer and connected response</title>
<desc id="arch-description">Field input branches into phone-local guidance and an IndexedDB SOS outbox. The outbox supports compass context and Android BLE or QR handoff to a nearby phone. Available HTTP links sync reports to FastAPI, Qdrant Edge in the Python backend, and volunteer or Command HQ views. Qdrant Server mirroring is optional.</desc>
<defs>
<marker id="arch-arrow" markerHeight="5" markerWidth="5" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path d="M0 0 8 4 0 8Z" fill="#66716e"/></marker>
<style>
      .architecture-diagram text{font-family:Arial,Helvetica,sans-serif;fill:#26302c}
      .architecture-diagram .arch-domain{fill:none;stroke:#b9c0b9;stroke-width:1;stroke-dasharray:3 4}
      .architecture-diagram .arch-node{fill:#fff;stroke:#9ba69e;stroke-width:1;rx:4}
      .architecture-diagram .arch-heading{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#647069}
      .architecture-diagram .arch-title{font-size:16px;font-weight:600}
      .architecture-diagram .arch-copy{font-size:13px;fill:#68726b}
      .architecture-diagram .arch-caption{font-size:11px;fill:#738078}
      .architecture-diagram .arch-line{fill:none;stroke:#66716e;stroke-width:1.3;marker-end:url(#arch-arrow)}
      .architecture-diagram .arch-connected{stroke-dasharray:5 4}
      .architecture-diagram .arch-rule{stroke:#d7dcd6;stroke-width:1}
      .architecture-diagram .arch-signal{fill:#5c8f78;offset-rotate:0deg;offset-distance:0%;opacity:.8}
      .architecture-diagram .arch-signal-local{offset-path:path('M206 141H230V115H246')}
      .architecture-diagram .arch-signal-peer{offset-path:path('M350 266V330')}
      @media(prefers-reduced-motion:reduce){.architecture-diagram .arch-signal{display:none;animation:none}}
    </style>
</defs>
<rect fill="#f6f7f3" height="470" width="1320"/>
<rect class="arch-domain" height="270" rx="6" width="620" x="24" y="20"/>
<g class="arch-dependent" data-requires="gateway"><rect class="arch-domain" height="270" rx="6" width="586" x="710" y="20"/></g>
<text class="arch-heading" x="44" y="46">01 / PHONE · OFFLINE</text>
<g class="arch-dependent" data-requires="gateway"><text class="arch-heading" x="730" y="46">03 / RESPONSE NODE · CONNECTED</text></g>
<g class="arch-component" data-node="input" data-order="0"><rect class="arch-node" height="144" width="158" x="48" y="96"/>
<text class="arch-title" x="64" y="126">Field input</text>
<path class="arch-rule" d="M64 139H190"/>
<text class="arch-copy" x="64" y="160">Text prompt</text>
<text class="arch-copy" x="64" y="184">GPS location</text>
<text class="arch-copy" x="64" y="208">SOS report</text>
</g><g class="arch-component" data-node="search" data-order="1"><rect class="arch-node" height="70" width="206" x="254" y="80"/>
<text class="arch-title" x="270" y="106">Local search</text>
<text class="arch-copy" x="270" y="129">Bundled cards + vectors</text>
</g><g class="arch-component" data-node="guidance" data-order="2"><rect class="arch-node" height="70" width="120" x="498" y="80"/>
<circle cx="512" cy="102" fill="#5c8f78" r="3"/>
<text class="arch-title" x="510" y="121">Guidance</text>
<text class="arch-caption" x="510" y="139">On the phone</text>
</g><g class="arch-connection" data-requires="input search"><path class="arch-line" d="M206 141H230V115H246"/></g>
<g class="arch-connection" data-requires="search guidance"><path class="arch-line" d="M460 115H490"/></g>
<g class="arch-component" data-node="outbox" data-order="3"><rect class="arch-node" height="66" width="206" x="254" y="200"/>
<text class="arch-title" x="270" y="226">SOS outbox</text>
<text class="arch-copy" x="270" y="249">IndexedDB · stored reports</text>
</g><g class="arch-component" data-node="direction" data-order="4"><rect class="arch-node" height="66" width="120" x="498" y="200"/>
<text class="arch-title" x="510" y="226">Direction</text>
<text class="arch-caption" x="510" y="248">Compass + GPS</text>
</g><g class="arch-connection" data-requires="input outbox"><path class="arch-line" d="M206 210H230V233H246"/></g>
<g class="arch-connection" data-requires="outbox direction"><path class="arch-line" d="M460 233H490"/></g>
<g class="arch-component" data-node="gateway" data-order="6"><rect class="arch-node" height="70" width="230" x="732" y="92"/>
<text class="arch-title" x="748" y="119">FastAPI gateway</text>
<text class="arch-copy" x="748" y="142">Intake · sync · role routes</text>
</g><g class="arch-component" data-node="response" data-order="8"><rect class="arch-node" height="70" width="262" x="1010" y="92"/>
<text class="arch-title" x="1026" y="119">Response workspaces</text>
<text class="arch-copy" x="1026" y="142">Volunteer · Command HQ</text>
</g><g class="arch-connection" data-requires="gateway response"><path class="arch-line" d="M962 127H1002"/></g>
<g class="arch-component" data-node="edge" data-order="7"><rect class="arch-node" height="66" width="230" x="732" y="198"/>
<text class="arch-title" x="748" y="224">Qdrant Edge</text>
<text class="arch-copy" x="748" y="247">Python backend · retrieval</text>
</g><g class="arch-component" data-node="mirror" data-order="9"><rect class="arch-node" height="66" width="262" x="1010" y="198"/>
<text class="arch-title" x="1026" y="224">Qdrant Server mirror</text>
<text class="arch-copy" x="1026" y="247">Optional · when configured</text>
</g><g class="arch-connection" data-requires="gateway edge"><path class="arch-line" d="M847 162V190"/></g>
<g class="arch-connection" data-requires="edge mirror"><path class="arch-line arch-connected" d="M962 231H1002"/></g>
<g class="arch-connection" data-requires="outbox gateway"><path class="arch-line arch-connected" d="M360 200V177H662V127H724"/></g>
<g class="arch-dependent" data-requires="outbox gateway"><text class="arch-caption" x="483" y="170">HTTP · when connected</text></g>
<g class="arch-dependent" data-requires="peer"><text class="arch-heading" x="48" y="363">02 / NEARBY</text></g>
<g class="arch-dependent" data-requires="peer"><text class="arch-caption" x="48" y="386">No saved OS pairing</text></g>
<g class="arch-component" data-node="peer" data-order="5"><rect class="arch-node" height="70" width="364" x="254" y="338"/>
<text class="arch-title" x="270" y="364">Nearby RescueMemory phone</text>
<text class="arch-copy" x="270" y="387">Android BLE SOS · QR fallback</text>
</g><g class="arch-connection" data-requires="outbox peer"><path class="arch-line" d="M350 266V330"/></g>
<g class="arch-connection" data-requires="peer gateway"><path class="arch-line arch-connected" d="M618 373H686V127H724"/></g>
<g class="arch-dependent" data-requires="peer gateway"><text class="arch-caption" x="713" y="378">Reports sync when a link becomes available.</text></g>
<g class="arch-dependent" data-requires="peer gateway"><text class="arch-caption" x="713" y="399">Offline guidance stays local; peer exchange carries reports.</text></g>
<g class="arch-dependent" data-requires="input search"><circle aria-hidden="true" class="arch-signal arch-signal-local" cx="0" cy="0" r="3"/></g>
<g class="arch-dependent" data-requires="outbox peer"><circle aria-hidden="true" class="arch-signal arch-signal-peer" cx="0" cy="0" r="3"/></g>
<path class="arch-rule" d="M24 429H1296"/>
<path d="M44 448H74" stroke="#66716e" stroke-width="1.3"/>
<text class="arch-caption" x="85" y="452">Local / nearby transfer</text>
<path d="M310 448H340" stroke="#66716e" stroke-dasharray="5 4" stroke-width="1.3"/>
<text class="arch-caption" x="351" y="452">Connection or configuration required</text>
<text class="arch-caption" text-anchor="end" x="1268" y="452">Current implementation · details below</text>
</svg>
